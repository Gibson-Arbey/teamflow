services:
  teamflow-db:
    image: postgres:16-alpine
    container_name: teamflow-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: teamflow-db
    volumes:
      - teamflow_data:/var/lib/postgresql/data
volumes:
  teamflow_data: